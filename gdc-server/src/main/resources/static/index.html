<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDC Edge Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #4fc3f7; }
        .dashboard-container { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
        .alert-card { background: #1e1e1e; border-left: 5px solid #ff5252; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border-radius: 4px; }
        .alert-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .priority-badge { background: #ff5252; color: #fff; padding: 5px 10px; border-radius: 3px; font-weight: bold; }
        .timestamp { color: #aaa; font-size: 0.9em; }
        .payload { font-size: 1.1em; margin: 0; }
        .no-alerts { text-align: center; color: #aaa; padding: 40px; background: #1e1e1e; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Vanguard-Total GDC Live Dashboard</h1>
    <div id="alerts-container" class="dashboard-container">
        <div class="no-alerts">Connecting to GDC Edge Node...</div>
    </div>

    <script>
        async function fetchAlerts() {
            try {
                const response = await fetch('/api/alerts/active');
                if (!response.ok) throw new Error('Network response was not ok');
                const alerts = await response.json();
                
                const container = document.getElementById('alerts-container');
                container.innerHTML = '';
                
                if (alerts.length === 0) {
                    container.innerHTML = '<div class="no-alerts">No active emergencies detected. System operational.</div>';
                    return;
                }

                alerts.forEach(alert => {
                    const card = document.createElement('div');
                    card.className = 'alert-card';
                    card.innerHTML = `
                        <div class="alert-header">
                            <span class="priority-badge">${alert.priority}</span>
                            <span class="timestamp">${new Date(alert.timestamp).toLocaleTimeString()}</span>
                        </div>
                        <p class="payload">${alert.payload}</p>
                        <p style="font-size:0.8em; color:#777; margin-top:5px; margin-bottom:0;">ID: ${alert.uniqueId}</p>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error('Error fetching alerts:', error);
                document.getElementById('alerts-container').innerHTML = 
                    '<div class="no-alerts" style="color:#ff5252;">Connection lost to GDC Edge Node. Retrying...</div>';
            }
        }

        setInterval(fetchAlerts, 2000);
        fetchAlerts();
    </script>
</body>
</html>
