<!DOCTYPE html>
<html>
<head>
    <title>Vanguard GDC | Security Command</title>
    <style>
        body { background: #0a0a0a; color: #eee; font-family: 'Segoe UI', sans-serif; padding: 30px; }
        .header { border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
        .alert-card { background: #1a1a1a; border-left: 5px solid #ff5252; padding: 20px; margin-bottom: 15px; border-radius: 4px; display: flex; justify-content: space-between; animation: slideIn 0.3s ease-out; }
        .priority-1 { border-left-color: #ff5252; background: rgba(255, 82, 82, 0.1); }
        .timestamp { color: #888; font-size: 12px; }
        .room-num { font-size: 24px; font-weight: bold; color: #ff5252; }
        @keyframes slideIn { from { transform: translateX(-20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .empty-state { text-align: center; color: #444; margin-top: 100px; font-size: 20px; }
    </style>
</head>
<body>

<div class="header">
    <h1>VANGUARD GDC: LIVE MONITOR</h1>
    <div id="status" style="color: #00e676;">● SYSTEM ONLINE</div>
</div>

<div id="alert-container">
    <div class="empty-state">No active emergencies. Standing by...</div>
</div>

<script>
    async function fetchAlerts() {
        try {
            const response = await fetch('http://localhost:8080/api/alerts/active');
            const alerts = await response.json();
            const container = document.getElementById('alert-container');

            if (alerts.length === 0) {
                container.innerHTML = '<div class="empty-state">No active emergencies. Standing by...</div>';
                return;
            }

            container.innerHTML = ''; // Clear for update
            alerts.forEach(alert => {
                const time = new Date(alert.timestamp).toLocaleTimeString();
                container.innerHTML += `
                    <div class="alert-card priority-${alert.priority}">
                        <div>
                            <div class="timestamp">RECEIVED AT: ${time}</div>
                            <div style="margin-top:5px;">${alert.payload}</div>
                        </div>
                        <div style="text-align: right;">
                            <div class="room-num">ROOM 402</div>
                            <button style="background:#444; color:white; border:none; padding:5px 10px; cursor:pointer;">DISPATCHED</button>
                        </div>
                    </div>
                `;
            });
        } catch (e) {
            document.getElementById('status').innerHTML = '<span style="color:red;">● SERVER OFFLINE</span>';
        }
    }

    // Refresh the dashboard every 3 seconds
    setInterval(fetchAlerts, 3000);
    fetchAlerts();
</script>
</body>
</html>
