<!DOCTYPE html>
<html>
<head>
    <title>Vanguard Chaos Test: Mesh Network Simulation</title>
    <style>
        body { background-color: #121212; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; margin: 0; padding: 20px;}
        header { text-align: center; margin-bottom: 20px; }
        canvas { background-color: #1e1e1e; border: 2px solid #555; display: block; margin: 0 auto; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
        #status-panel { display: flex; justify-content: space-around; margin-top: 15px; font-size: 18px;}
        #logs { max-width: 800px; margin: 15px auto; background: #000; padding: 10px; border: 1px solid #333; height: 100px; overflow-y: scroll; font-family: monospace; font-size: 14px; }
        .highlight { color: #ff5252; font-weight: bold; }
        .success { color: #00e676; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <h2>Vanguard-Total: Chaos Test Simulation</h2>
    <p>Target: 65 Nodes | Simulating Extreme Infrastructure Collapse & Trionic P2P Routing</p>
</header>

<canvas id="meshCanvas" width="800" height="400"></canvas>

<div id="status-panel">
    <div>Time: <span id="timer">0.00s</span></div>
    <div>Status: <span id="alive-status" class="success">SYSTEM ONLINE</span></div>
</div>

<div id="logs"></div>

<script>
const canvas = document.getElementById('meshCanvas');
const ctx = canvas.getContext('2d');

let nodes = [];
const TOTAL_NODES = 65;
const CONNECTION_RADIUS = 185;
const relayCount = 15;

let gdcNodeIndex = 0;
let room402Index = 0;

let simTime = 0;
let propagationComplete = false;
let logs = document.getElementById('logs');

function logMessage(msg, type="") {
    let entry = document.createElement("div");
    // FIXED LINE BELOW (Added backticks)
    entry.innerHTML = `[${(simTime/1000).toFixed(2)}s] <span class="${type}">${msg}</span>`;
    logs.appendChild(entry);
    logs.scrollTop = logs.scrollHeight;
}

function init() {
    nodes = [];
    for(let i=0; i<TOTAL_NODES; i++) {
        let x, y;
        if (i === 0) {
            x = 50; y = 50;
        } else if (i === TOTAL_NODES - 1) {
            x = 750; y = 350;
            room402Index = i;
        } else {
            x = 100 + Math.random() * 600;
            y = 50 + Math.random() * 300;
        }
        nodes.push({
            id: i, x: x, y: y,
            isAlive: true,
            hasSos: false,
            isGdc: i === 0,
            isRoom402: i === TOTAL_NODES - 1,
            isPhantom: false
        });
    }
    logMessage("Vanguard Grid Initialized.", "success");
    draw();
    setTimeout(causeChaos, 1500);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for(let i=0; i<nodes.length; i++) {
        for(let j=i+1; j<nodes.length; j++) {
            let n1 = nodes[i];
            let n2 = nodes[j];
            let dist = Math.hypot(n1.x - n2.x, n1.y - n2.y);
            if (dist < CONNECTION_RADIUS && n1.isAlive && n2.isAlive) {
                ctx.beginPath();
                ctx.moveTo(n1.x, n1.y);
                ctx.lineTo(n2.x, n2.y);
                ctx.strokeStyle = (n1.hasSos && n2.hasSos) ? "rgba(255, 82, 82, 0.9)" : "rgba(100, 255, 100, 0.2)";
                ctx.lineWidth = (n1.hasSos && n2.hasSos) ? 3 : 1;
                ctx.stroke();
            }
        }
    }
    nodes.forEach(n => {
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.isGdc || n.isRoom402 ? 14 : 7, 0, Math.PI * 2);
        if (!n.isAlive) {
            ctx.fillStyle = "#333";
        } else if (n.isPhantom) {
            ctx.fillStyle = "#ffeb3b";
        } else if (n.isGdc) {
            ctx.fillStyle = n.hasSos ? "#00e676" : "#2196f3";
        } else if (n.isRoom402 || n.hasSos) {
            ctx.fillStyle = "#ff5252";
        } else {
            ctx.fillStyle = "#00e676";
        }
        ctx.fill();
    });
}

function causeChaos() {
    logMessage("Infrastructure Lost. Deploying Relays...", "highlight");
    let killed = 0;
    let killTarget = Math.floor(TOTAL_NODES * 0.35);
    while (killed < killTarget) {
        let rnd = Math.floor(Math.random() * TOTAL_NODES);
        if (!nodes[rnd].isGdc && !nodes[rnd].isRoom402 && nodes[rnd].isAlive) {
            nodes[rnd].isAlive = false;
            killed++;
        }
    }
    for (let i = 0; i < relayCount; i++) {
        nodes.push({
            id: nodes.length,
            x: 150 + (Math.random() * 500),
            y: 100 + (Math.random() * 200),
            isAlive: true,
            hasSos: false,
            isGdc: false,
            isRoom402: false,
            isPhantom: true
        });
    }
    draw();
    setTimeout(triggerSos, 800);
}

function triggerSos() {
    logMessage("SOS from Room 402", "highlight");
    nodes[room402Index].hasSos = true;
    propagateMesh();
}

function propagateMesh() {
    if (propagationComplete) return;
    let pactedNodes = nodes.filter(n => n.hasSos && n.isAlive);
    let foundNew = false;
    for (let p of pactedNodes) {
        for (let target of nodes) {
            if (target.isAlive && !target.hasSos && Math.hypot(p.x - target.x, p.y - target.y) < CONNECTION_RADIUS) {
                target.hasSos = true;
                foundNew = true;
            }
        }
    }
    if (foundNew) {
        draw();
         if (nodes[gdcNodeIndex].hasSos) {
    logMessage("SUCCESS: SOS delivered to GDC!", "success");
    
    const simPacket = {
        uniqueId: "SIM-" + Date.now(),
        priority: 2,
        payload: "AUTOMATED_MESH_DETECTION: Room 402 Connectivity Lost",
        timestamp: Date.now(),
        timeToLive: 300000
    };

    fetch('http://localhost:8080/api/alerts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(simPacket)
    })
    .then(() => logMessage("GDC Edge Registry Updated.", "success"))
    .catch(e => console.log("Backend offline."));

    propagationComplete = true;
}
        else {
            setTimeout(propagateMesh, 300);
        }
    } else {
        logMessage("FAILURE: Mesh partitioned.", "highlight");
    }
}

setInterval(() => {
    if (!propagationComplete) {
        simTime += 50;
        draw();
        document.getElementById('timer').innerText = (simTime/1000).toFixed(2) + "s";
    }
}, 50);

init();
</script>
</body>
</html>
