<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanguard GDC | Gateway</title>
    <style>
        body { background: #0a0a0a; color: white; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; overflow: hidden; }
        .login-card { background: #121212; padding: 40px; border-radius: 24px; border: 1px solid #333; text-align: center; width: 350px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); position: relative; z-index: 1; }
        .logo { font-size: 28px; font-weight: bold; letter-spacing: 3px; color: #ff5252; margin-bottom: 10px; }
        .subtitle { color: #666; font-size: 12px; margin-bottom: 35px; text-transform: uppercase; letter-spacing: 1px; }
        .portal-btn { width: 100%; padding: 16px; margin: 12px 0; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .admin-btn { background: #1a1a1a; color: white; border: 1px solid #444; }
        .admin-btn:hover { border-color: #ff5252; background: #222; }
        .guest-btn { background: #ff5252; color: white; box-shadow: 0 4px 15px rgba(255, 82, 82, 0.3); }
        .guest-btn:hover { background: #ff1744; transform: translateY(-2px); }
        
        /* Password Modal */
        #admin-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; align-items: center; justify-content: center; }
        .modal-content { background: #181818; padding: 30px; border-radius: 20px; border: 1px solid #ff5252; width: 300px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 15px 0; background: #000; border: 1px solid #444; color: white; border-radius: 8px; text-align: center; box-sizing: border-box; }
        .verify-btn { background: #ff5252; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo">VANGUARD</div>
        <div class="subtitle">Mesh Defense Protocol</div>
        
        <button class="portal-btn guest-btn" onclick="window.location.href='guest_app.html'">
            📱 ENTER GUEST SOS APP
        </button>

        <button class="portal-btn admin-btn" onclick="showAdminLogin()">
            🛡️ SECURITY COMMAND
        </button>

        <p style="font-size: 11px; color: #444; margin-top: 25px;">GDC-CORE V3.9.6 | STATUS: <span style="color: #00e676;">ENCRYPTED</span></p>
    </div>

    <div id="admin-modal">
        <div class="modal-content">
            <h3 style="margin-top: 0;">Admin Auth</h3>
            <p style="font-size: 12px; color: #888;">Enter Secure Access Key</p>
            <input type="password" id="admin-pass" placeholder="••••••••">
            <button class="verify-btn" onclick="verifyAdmin()">AUTHORIZE</button>
            <button onclick="hideAdminLogin()" style="background:none; border:none; color:#555; margin-top:15px; cursor:pointer;">Cancel</button>
        </div>
    </div>

    <script>
        function showAdminLogin() {
            document.getElementById('admin-modal').style.display = 'flex';
            document.getElementById('admin-pass').focus();
        }

        function hideAdminLogin() {
            document.getElementById('admin-modal').style.display = 'none';
        }

        function verifyAdmin() {
            const pass = document.getElementById('admin-pass').value;
            // You can use "admin123" or "vanguard2026" as your demo password
            if (pass === "admin123") {
                window.location.href = 'gdc_dashboard.html';
            } else {
                alert("ACCESS DENIED: Invalid Security Key");
                document.getElementById('admin-pass').value = "";
            }
        }

        // Allow "Enter" key to submit
        document.getElementById('admin-pass').addEventListener("keyup", function(event) {
            if (event.key === "Enter") verifyAdmin();
        });
    </script>
</body>
</html>
